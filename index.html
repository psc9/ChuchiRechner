<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ee">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="ChuchiRechner">
<title>ChuchiRechner</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#ffffff; --ink:#2b2a27; --muted:#7a756b; --line:#e7e1d6;
    --accent:#c8742c; --accent-soft:#f6e6d6; --warn-bg:#fff6e5; --warn:#8a5a12;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1c1b19; --card:#262522; --ink:#f0ece4; --muted:#a59f93; --line:#3a3833;
      --accent:#e3954f; --accent-soft:#3a2c20; --warn-bg:#33291a; --warn:#e8c27a; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  main{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  label.q{display:block;font-weight:650;font-size:17px;margin-bottom:10px}
  .card .k{display:block;font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
  .amount{display:flex;align-items:center;gap:10px}
  .step{width:52px;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);
    color:var(--ink);font-size:26px;line-height:1;cursor:pointer;flex:none}
  .step:active{background:var(--accent-soft)}
  .field{flex:1;display:flex;align-items:baseline;justify-content:center;gap:6px;
    border:1.5px solid var(--accent);border-radius:14px;height:52px;padding:0 12px;background:var(--card)}
  .field input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
    font-size:28px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .field span{font-size:18px;color:var(--muted);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;
    padding:7px 13px;font-size:14px;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .water{background:var(--accent-soft);border-radius:16px;padding:14px 16px}
  .water .k{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .water .row{display:flex;align-items:baseline;gap:8px;margin-top:4px}
  .water input{flex:none;width:3ch;min-width:1.5ch;border:0;border-bottom:2px dashed transparent;outline:0;background:transparent;
    color:var(--ink);font-size:38px;font-weight:750;font-variant-numeric:tabular-nums;padding:0;font-family:inherit}
  .water input:focus{border-bottom-color:var(--accent)}
  .water .u{font-size:38px;font-weight:750;flex:none}
  .water .n{font-size:13px;color:var(--muted);margin-top:4px}
  .quote{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:32px 12px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  .quote p{margin:0;font-family:"New York",Georgia,"Times New Roman",serif;font-style:italic;font-size:24px;line-height:1.35;
    color:var(--ink);opacity:.8;transition:opacity .35s}
  .quote p.out{opacity:0}
  .quote .n{font-size:12px;color:var(--muted);margin-top:14px}
  .hint{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<main>
  <section class="card">
    <label class="k" for="amount">Produkt</label>
    <div class="amount">
      <button class="step" id="minus" aria-label="weniger">−</button>
      <div class="field"><input id="amount" inputmode="numeric" value="250"><span>g</span></div>
      <button class="step" id="plus" aria-label="mehr">+</button>
    </div>
    <div class="chips" id="chips"></div>
  </section>

  <section class="water">
    <label class="k" for="water">Wasser</label>
    <div class="row"><input id="water" inputmode="decimal" value="5 ½" size="4"><span class="u">dl</span></div>
    <div class="n">Antippen zum Ändern</div>
  </section>
  <div id="hints"></div>

  <section class="quote" id="quote" aria-live="polite">
    <p id="quoteText"></p>
    <div class="n">Antippen für den nächsten Spruch</div>
  </section>
</main>

<script>
(function(){
  const QUICK = [250, 500, 750, 1000], STEP = 50;
  const $ = id => document.getElementById(id);
  const amountEl = $("amount"), waterEl = $("water");
  let ratio = 5.5 / 250;   // dl Wasser pro g

  function num(v){
    let s = String(v).replace(",", ".").replace(/½/g, ".5").replace(/\s+/g, "");
    s = s.replace(/(\d)\.5\.?/, "$1.5");
    const n = parseFloat(s); return isFinite(n) ? n : 0;
  }
  function dl(x){
    const h = Math.round(x * 2) / 2, whole = Math.floor(h), half = h - whole ? "½" : "";
    return (whole ? whole + (half ? " " : "") : (half ? "" : "0")) + half;
  }
  function grams(){ return Math.max(0, num(amountEl.value)); }

  // Breite der Wassereingabe an den Inhalt anpassen (über ein unsichtbares Mess-Element)
  const meter = document.createElement("span");
  meter.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-size:38px;font-weight:750;font-variant-numeric:tabular-nums";
  document.body.appendChild(meter);
  function fit(){
    meter.textContent = waterEl.value || "0";
    waterEl.style.width = Math.ceil(meter.getBoundingClientRect().width + 2) + "px";
  }
  function showWater(){ waterEl.value = dl(grams() * ratio); fit(); }

  function renderExtras(){
    const g = grams(), w = g * ratio;
    $("hints").innerHTML = (g >= 500 && w > 0)
      ? `<div class="hint"><b>Tipp bei grossen Mengen:</b> Es verdunstet im Verhältnis weniger Wasser. Wenn es sonst zu weich wird: eher <b>${dl(w * 0.95)} dl</b> nehmen.</div>`
      : "";
    $("chips").innerHTML = QUICK.map(q => `<button class="chip${Math.round(g) === q ? " on" : ""}" data-g="${q}">${q >= 1000 ? q / 1000 + " kg" : q + " g"}</button>`).join("");
  }

  function setAmount(v){ amountEl.value = Math.max(0, Math.round(v)); showWater(); renderExtras(); }

  $("minus").addEventListener("click", () => setAmount(grams() - STEP));
  $("plus").addEventListener("click", () => setAmount(grams() + STEP));
  $("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setAmount(+b.dataset.g); });
  amountEl.addEventListener("input", () => { showWater(); renderExtras(); });
  amountEl.addEventListener("focus", () => amountEl.select());

  // Wasser überschreiben: neues Verhältnis gilt für alle Mengen
  waterEl.addEventListener("focus", () => waterEl.select());
  waterEl.addEventListener("input", () => {
    fit();
    const w = num(waterEl.value), g = grams();
    if (g > 0 && w > 0) { ratio = w / g; renderExtras(); }
  });
  waterEl.addEventListener("blur", showWater);

  // Spruch: zufällig beim Öffnen, Antippen zeigt den nächsten
  const SPRUECHE = [
    "Hunger ist der beste Koch.",
    "Der Mensch ist, was er isst.",
    "Liebe geht durch den Magen.",
    "Das Auge isst mit.",
    "Probieren geht über Studieren.",
    "Der Appetit kommt beim Essen.",
    "Es wird nichts so heiss gegessen, wie es gekocht wird.",
    "Viele Köche verderben den Brei.",
    "Gut Ding will Weile haben.",
    "Essen und Trinken hält Leib und Seele zusammen.",
    "Jeder Topf findet seinen Deckel.",
    "Ein voller Bauch studiert nicht gern.",
    "Nach dem Essen sollst du ruhn oder tausend Schritte tun.",
    "Salz und Brot macht Wangen rot.",
    "In der Kürze liegt die Würze.",
    "Wasser kocht nicht schneller, wenn man zuschaut.",
    "Wer kocht, darf naschen.",
    "Abschmecken ist die halbe Miete.",
    "Selbst gekocht schmeckt doppelt gut.",
    "Gutes Essen braucht keine Eile.",
    "Kochen ist Liebe, die man essen kann.",
    "Ein Rezept ist ein Vorschlag, kein Gesetz.",
    "Ein Löffel Geduld macht jedes Risotto besser.",
    "Am Tisch wird niemand alt.",
    "Lieber den Magen verrenkt, als dem Wirt was geschenkt.",
    "En Guete!"
  ];
  const quoteText = $("quoteText");
  let qi = Math.floor(Math.random() * SPRUECHE.length);
  quoteText.textContent = SPRUECHE[qi];
  $("quote").addEventListener("click", () => {
    quoteText.classList.add("out");
    setTimeout(() => {
      qi = (qi + 1 + Math.floor(Math.random() * (SPRUECHE.length - 1))) % SPRUECHE.length;
      quoteText.textContent = SPRUECHE[qi];
      quoteText.classList.remove("out");
    }, 350);
  });

  showWater(); renderExtras();
})();
</script>
</body>
</html>
